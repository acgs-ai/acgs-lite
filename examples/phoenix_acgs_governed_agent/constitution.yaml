name: "phoenix-acgs-governed-agent-policy"
version: "1.0"

rules:
  - id: no-pii
    text: "Block PII exposure"
    severity: CRITICAL
    workflow_action: block
    patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"
      - "(?i)\\bsocial\\s+security\\b"

  - id: require-review
    text: "Queue high-cost operations for human review"
    severity: HIGH
    workflow_action: require_human_review
    patterns:
      - "(?i)\\b(wire|bank)\\s+transfer\\b"
      - "(?i)\\binitiate\\s+payment\\b"

  - id: allow-general
    text: "Allow general queries"
    severity: LOW
    patterns: []
