name: immutable-core-guard

# Blocks pull requests where an agent-authored change touches the immutable
# core (evaluator, policy, tool allowlist, IAM, CI rules, audit, control plane).
# The guard script and its registry are taken from the PR *base* commit, so a
# PR cannot weaken the guard that judges it.
#
# TODO(control-plane-gap): on `pull_request` GitHub runs this workflow file
# from the PR merge ref, so a PR could edit this file itself. That edit is
# caught by CODEOWNERS (.github/** needs human review) and must be backed by
# branch protection making this job a required check. `pull_request_target`
# would pin the workflow to base but needs a separate security review.

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR (full history for the diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out base guard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _guard
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install guard (core deps only)
        run: pip install -e ./_guard
      - name: Collect commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%B "${BASE_SHA}..${HEAD_SHA}" > "${RUNNER_TEMP}/commit-messages.txt"
      - name: Check immutable core
        # Untrusted values (branch name, login) pass through env, never
        # interpolated into the shell script.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          python _guard/scripts/check_immutable_core_diff.py
          --repo .
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --author "${PR_AUTHOR}"
          --head-ref "${HEAD_REF}"
          --commit-messages-file "${RUNNER_TEMP}/commit-messages.txt"
